    - data:
        code: "\"\"\"Pure game rules, embedded unchanged in the Dify Code node.\"\"\
          \"\nimport copy\n\nITEMS = {\n    \"1\": (\"倒着下雨的伞\", \"伞里藏着失主没说出口的一句道歉\"\
          ),\n    \"2\": (\"通往昨天的车票\", \"车票背面写着：不要阻止告别\"),\n    \"3\": (\"总慢半拍的影子\"\
          , \"影子只是想有一次自己选方向\"),\n}\nPRICES = {\"1\": \"一个秘密\", \"2\": \"一分钟明天\", \"\
          3\": \"一个冷笑话\"}\n\n\ndef fresh_state():\n    return {\"stage\": \"arrival\"\
          , \"round\": 1, \"item\": \"\", \"price\": \"\", \"receipts\": []}\n\n\n\
          def resolve(state, action):\n    \"\"\"Only explicit numbered choices change\
          \ the ledger; free chat does not.\"\"\"\n    s = copy.deepcopy(state)\n\
          \    action = action.strip()\n    changed = False\n    if action == \"重新开局\"\
          :\n        s.update(stage=\"arrival\", round=s[\"round\"] + 1, item=\"\"\
          , price=\"\")\n        changed = True\n    if action == \"档案\":\n      \
          \  scene = \"旧账本翻开了。\" + (\"\\n\".join(s[\"receipts\"]) or \"还没有完成的交易。\"\
          )\n    elif s[\"stage\"] == \"arrival\":\n        if action in ITEMS:\n\
          \            s.update(stage=\"bargain\", item=ITEMS[action][0])\n      \
          \      scene = \"你拿起了“%s”。%s。\" % ITEMS[action]\n            changed = True\n\
          \        else:\n            scene = \"零点的钟只响了十一下。店主阿迟说：这里寄存的，都是现实放不下的东西。\"\
          \n    elif s[\"stage\"] == \"bargain\":\n        if action in PRICES:\n\
          \            s.update(stage=\"delivery\", price=PRICES[action])\n      \
          \      scene = \"你以“%s”换取了“%s”的认领资格。阿迟盖章：代价已付，去向由你。\" % (s[\"price\"], s[\"\
          item\"])\n            changed = True\n        else:\n            scene =\
          \ \"阿迟敲了敲价目表：认领资格不能用钱买。请选择一种代价。\"\n    elif s[\"stage\"] == \"delivery\"\
          :\n        endings = {\"1\": \"归还失主\", \"2\": \"暂存店中\", \"3\": \"带回现实\"\
          }\n        if action in endings:\n            receipt = \"第%d夜：%s；代价：%s；去向：%s。\"\
          \ % (s[\"round\"], s[\"item\"], s[\"price\"], endings[action])\n       \
          \     s[\"receipts\"] = (s[\"receipts\"] + [receipt])[-12:]\n          \
          \  s[\"stage\"] = \"ended\"\n            scene = receipt + \"阿迟把收据折成纸鹤：下次见，我会记得。\"\
          \n            changed = True\n        else:\n            scene = \"门外有人敲门，声音像那件失物。你还有最后一个决定。\"\
          \n    else:\n        scene = \"阿迟认出了你，摊开上次的收据：\" + s[\"receipts\"][-1] +\
          \ \"输入“重新开局”，再收一件失物。\"\n    choices = {\n        \"arrival\": \"1 · 倒着下雨的伞\\\
          n2 · 通往昨天的车票\\n3 · 总慢半拍的影子\",\n        \"bargain\": \"1 · 一个秘密\\n2 · 一分钟明天\\\
          n3 · 一个冷笑话\",\n        \"delivery\": \"1 · 归还失主\\n2 · 暂存店中\\n3 · 带回现实\"\
          ,\n        \"ended\": \"重新开局 · 开始下一夜\\n档案 · 查看旧账本\",\n    }[s[\"stage\"\
          ]]\n    memory = \"\\n\".join(s[\"receipts\"][-3:]) or \"第一次来访，没有历史交易。\"\
          \n    return {\"state\": s, \"changed\": changed, \"scene\": scene, \"choices\"\
          : choices, \"memory\": memory}\n\nimport json\n\ndef main(body: str, status:\
          \ int, player: str, action: str) -> dict:\n    if status != 200:\n     \
          \   raise ValueError(\"记忆服务读取失败，请检查服务地址与密钥。\")\n    previous = json.loads(body)\n\
          \    result = resolve(previous[\"state\"], action)\n    payload = {\"player\"\
          : player, \"revision\": previous[\"revision\"],\n               \"action\"\
          : action, \"state\": result[\"state\"]}\n    prompt = json.dumps({\"本轮已确定的事件\"\
          : result[\"scene\"], \"历史收据\": result[\"memory\"],\n                   \
          \      \"玩家说\": action, \"当前状态\": result[\"state\"][\"stage\"]}, ensure_ascii=False)\n\
          \    return {\"commit_body\": json.dumps(payload, ensure_ascii=False), \"\
          prompt\": prompt,\n            \"scene\": result[\"scene\"], \"choices\"\
          : result[\"choices\"]}\n"
        code_language: python3
