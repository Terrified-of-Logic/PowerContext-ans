<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>端侧知识库 · seekdb 混合检索</title>
<style>
  :root{--fg:#1b2430;--muted:#69737f;--line:#e3e8ee;--bg:#f6f8fa;--accent:#1f6feb;--ok:#1a7f37;}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       color:var(--fg);background:var(--bg)}
  header{padding:26px 20px 18px;max-width:900px;margin:0 auto}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--muted);font-size:13px}
  main{max-width:900px;margin:0 auto;padding:0 20px 60px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}
  .drop.hover{border-color:var(--accent);background:#f0f6ff}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=text]{flex:1 1 320px;padding:11px 14px;border:1px solid var(--line);border-radius:8px;font-size:15px}
  input[type=text]:focus{outline:2px solid rgba(31,111,235,.2);border-color:var(--accent)}
  button{padding:11px 20px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
  .status{font-size:13px;color:var(--muted);margin-top:10px;min-height:20px}
  .status.ok{color:var(--ok)}
  .backend{font-size:12px;margin-top:5px;color:var(--muted)}
  .backend.warn{color:#b35900;font-weight:600}
  .backend.gpu{color:var(--ok);font-weight:600}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .hit{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
  .hit h3{margin:0 0 4px;font-size:15px}
  .meta{color:var(--muted);font-size:12px;margin-bottom:6px}
  mark{background:#fff3b0;padding:0 2px;border-radius:2px}
  .empty{text-align:center;color:var(--muted);padding:34px 0}
  footer{max-width:900px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>端侧知识库</h1>
  <div class="sub">
    向量化在浏览器本地完成（Transformers.js + ONNX Runtime Web），检索与混合排序由 <b>seekdb</b> 执行。
  </div>
</header>

<main>
  <div class="panel">
    <div class="drop" id="drop">
      把 <b>.txt</b> / <b>.md</b> 文件拖到这里，或
      <input type="file" id="file" accept=".txt,.md" multiple style="display:none" />
      <button id="pick" style="margin-left:8px">选择文件</button>
    </div>
    <div class="status" id="status">模型未加载</div>
    <div class="backend" id="backend"></div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div class="panel">
    <div class="row">
      <input type="text" id="q" placeholder="输入问题，例如：seekdb 的向量索引怎么建？" />
      <button id="go">检索</button>
    </div>
  </div>

  <div id="out"></div>
</main>

<footer>
  端侧推理：@huggingface/transformers（模型 onnx-community/bge-small-zh-v1.5-ONNX，q8 量化，权重来自魔搭社区） ·
  检索：@oceanbase/seekdb-node 嵌入式实例 ·
  混合排序：向量距离 + 关键词命中，RRF 融合
</footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
